    <!-- Kalender Dinamis JS -->
    <script>
      const monthNames = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];

      let currentDate = new Date();
      let currentMonth = currentDate.getMonth();
      let currentYear = currentDate.getFullYear();

      const calendarGrid = document.getElementById("calendar-grid");
      const monthYearText = document.getElementById("calendar-month-year");

      function renderCalendar() {
        let htmlContent = `
                <div class="calendar-day-name">Mo</div>
                <div class="calendar-day-name">Tu</div>
                <div class="calendar-day-name">We</div>
                <div class="calendar-day-name">Th</div>
                <div class="calendar-day-name">Fr</div>
                <div class="calendar-day-name day-weekend">Sa</div>
                <div class="calendar-day-name day-weekend">Su</div>
            `;

        let firstDay = new Date(currentYear, currentMonth, 1).getDay();
        let startDay = firstDay === 0 ? 6 : firstDay - 1;

        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0,
        ).getDate();
        const daysInPrevMonth = new Date(
          currentYear,
          currentMonth,
          0,
        ).getDate();

        for (let i = startDay; i > 0; i--) {
          htmlContent += `<div class="day-item day-other-month">${daysInPrevMonth - i + 1}</div>`;
        }

        for (let i = 1; i <= daysInMonth; i++) {
          let isToday =
            i === new Date().getDate() &&
            currentMonth === new Date().getMonth() &&
            currentYear === new Date().getFullYear();
          let dayOfWeek = new Date(currentYear, currentMonth, i).getDay();
          let isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

          let classNames = "day-item";
          if (isWeekend) classNames += " day-weekend";

          if (isToday) {
            htmlContent += `<div class="day-item"><div class="day-active">${i}</div></div>`;
          } else {
            htmlContent += `<div class="${classNames}">${i}</div>`;
          }
        }

        let totalCellsFilled = startDay + daysInMonth;
        let remainingCells = 42 - totalCellsFilled;

        for (let i = 1; i <= remainingCells; i++) {
          htmlContent += `<div class="day-item day-other-month">${i}</div>`;
        }

        calendarGrid.innerHTML = htmlContent;
        monthYearText.innerText = `${monthNames[currentMonth]} ${currentYear}`;
      }

      renderCalendar();

      document.getElementById("prev-month").addEventListener("click", () => {
        currentMonth--;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }
        renderCalendar();
      });

      document.getElementById("next-month").addEventListener("click", () => {
        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
        renderCalendar();
      });
    </script>
